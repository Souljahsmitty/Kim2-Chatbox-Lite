<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --bg-hover: #252525;
            --accent: #10a37f;
            --accent-hover: #0d8c6d;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --border: #2a2a2a;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-item {
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-item:hover, .chat-item.active {
            background: var(--bg-tertiary);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .api-key-input, .model-select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .settings-group {
            margin-bottom: 12px;
        }

        .settings-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
        }

        .compression-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-secondary);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .welcome-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #00d4aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 24px;
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-avatar { background: var(--accent); color: white; }
        .ai-avatar { background: var(--bg-tertiary); border: 1px solid var(--border); }

        .message-content {
            flex: 1;
            padding-top: 6px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }

        .message-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 1px solid var(--border);
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .input-container {
            padding: 20px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .attachments-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .attachment-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
        }

        .attachment-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .attachment-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .message-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 200px;
            font-family: inherit;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .input-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .thinking {
            display: flex;
            gap: 4px;
            align-items: center;
            color: var(--text-secondary);
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        pre {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        pre code { background: none; padding: 0; }

        .hidden { display: none !important; }

        .debug-info {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-family: monospace;
        }

        .image-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            cursor: zoom-out;
        }

        .image-lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Chat
            </button>
        </div>
        <div class="chat-history" id="chatHistory"></div>
        <div class="sidebar-footer">
            <div class="settings-group">
                <label class="settings-label">API Configuration</label>
                <input type="text" class="api-key-input" id="apiKey" placeholder="API Key (sk-52DCwaoGRT7zE2lNwtX4uDxNyLPwipIThn0nxlXUgEv4KnI2)">
                <div class="debug-info" id="keyDebug">Key length: 0 | Starts with sk-: No</div>
                <select class="model-select" id="modelSelect">
                    <option value="kimi-k2.5">kimi-k2.5</option>
                    <option value="kimi-k1.5">kimi-k1.5</option>
                </select>
                <label class="compression-toggle" style="margin-top: 8px;">
                    <input type="checkbox" id="saveKey" checked>
                    <span>Save API key locally</span>
                </label>
            </div>
           
            <div class="settings-group">
                <label class="settings-label">Compression Settings</label>
                <label class="compression-toggle">
                    <input type="checkbox" id="enableCompression" checked>
                    <span>Enable image compression</span>
                </label>
                <label class="compression-toggle">
                    <input type="checkbox" id="enableResize" checked>
                    <span>Resize large images (max 2048px)</span>
                </label>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <div style="font-weight: 500;">Kimi Chat</div>
            <button class="icon-btn" onclick="startNewChat()" title="Clear chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen">
                <h1 class="welcome-title">How can I help you today?</h1>
                <p style="color: var(--text-secondary); margin-top: 8px;">
                    Chat with images • Video analysis<br>
                    <small>With intelligent compression for faster uploads</small>
                </p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <div class="attachments-preview hidden" id="attachmentsPreview"></div>
                <textarea class="message-input" id="messageInput" placeholder="Message Kimi..." rows="1"></textarea>
                <div class="input-footer">
                    <div class="input-actions">
                        <input type="file" id="fileInput" class="hidden" accept="image/*,video/*" multiple onchange="handleFileSelect(event)">
                        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload image/video">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </button>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // State
        let currentChatId = null;
        let isGenerating = false;
        let currentAttachments = [];
        let chats = JSON.parse(localStorage.getItem('kimi_chats') || '[]');
       
        // Load saved settings
        const savedKey = localStorage.getItem('kimi_api_key');
        const savedModel = localStorage.getItem('kimi_model');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            updateKeyDebug(savedKey);
        }
        if (savedModel) document.getElementById('modelSelect').value = savedModel;

        // Update debug info when typing
        document.getElementById('apiKey').addEventListener('input', function(e) {
            updateKeyDebug(e.target.value);
        });

        function updateKeyDebug(key) {
            const debug = document.getElementById('keyDebug');
            const cleanKey = key.trim();
            const startsWithSk = cleanKey.startsWith('sk-');
            debug.textContent = `Key length: ${cleanKey.length} | Starts with sk-: ${startsWithSk ? 'Yes' : 'No'}`;
            debug.style.color = startsWithSk ? 'var(--accent)' : 'var(--error)';
        }

        // Auto-resize textarea
        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Compression utilities
        async function compressImage(file) {
            const enableCompression = document.getElementById('enableCompression').checked;
            const enableResize = document.getElementById('enableResize').checked;
           
            if (!enableCompression && !enableResize) {
                return await fileToBase64(file);
            }

            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
               
                img.onload = () => {
                    URL.revokeObjectURL(url);
                   
                    let { width, height } = img;
                    const maxSize = 2048;
                   
                    if (enableResize && (width > maxSize || height > maxSize)) {
                        if (width > height) {
                            height = Math.round((height * maxSize) / width);
                            width = maxSize;
                        } else {
                            width = Math.round((width * maxSize) / height);
                            height = maxSize;
                        }
                    }
                   
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                   
                    let quality = 0.9;
                    if (enableCompression) {
                        if (file.size > 5 * 1024 * 1024) quality = 0.7;
                        else if (file.size > 2 * 1024 * 1024) quality = 0.8;
                    }
                   
                    const mimeType = file.type === 'image/png' && enableCompression ? 'image/jpeg' : file.type;
                    const compressed = canvas.toDataURL(mimeType, quality);
                   
                    const originalSize = (file.size / 1024 / 1024).toFixed(2);
                    const compressedSize = ((compressed.length * 0.75) / 1024 / 1024).toFixed(2);
                    console.log(`Compressed: ${originalSize}MB → ${compressedSize}MB`);
                   
                    resolve(compressed);
                };
               
                img.src = url;
            });
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function startNewChat() {
            currentChatId = null;
            currentAttachments = [];
            updateAttachmentsPreview();
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen">
                    <h1 class="welcome-title">How can I help you today?</h1>
                    <p style="color: var(--text-secondary); margin-top: 8px;">
                        Chat with images • Video analysis<br>
                        <small>With intelligent compression for faster uploads</small>
                    </p>
                </div>
            `;
            renderChatHistory();
        }

        async function handleFileSelect(event) {
            const files = Array.from(event.target.files);
           
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    const base64 = await compressImage(file);
                    currentAttachments.push({
                        type: 'image',
                        mimeType: file.type,
                        data: base64.split(',')[1],
                        name: file.name,
                        originalSize: file.size
                    });
                } else if (file.type.startsWith('video/')) {
                    await extractVideoFrames(file);
                }
            }
           
            updateAttachmentsPreview();
            event.target.value = '';
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function extractVideoFrames(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
               
                video.src = URL.createObjectURL(file);
                video.muted = true;
               
                video.onloadedmetadata = () => {
                    const duration = video.duration;
                    const frameTimes = [0, duration * 0.25, duration * 0.5, duration * 0.75, duration - 0.1];
                    const frames = [];
                   
                    video.onseeked = async () => {
                        let { videoWidth, videoHeight } = video;
                        const maxSize = 1024;
                       
                        if (videoWidth > maxSize || videoHeight > maxSize) {
                            if (videoWidth > videoHeight) {
                                videoHeight = Math.round((videoHeight * maxSize) / videoWidth);
                                videoWidth = maxSize;
                            } else {
                                videoWidth = Math.round((videoWidth * maxSize) / videoHeight);
                                videoHeight = maxSize;
                            }
                        }
                       
                        canvas.width = videoWidth;
                        canvas.height = videoHeight;
                        ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                       
                        const base64 = canvas.toDataURL('image/jpeg', 0.8);
                        frames.push({
                            type: 'image',
                            mimeType: 'image/jpeg',
                            data: base64.split(',')[1],
                            name: `${file.name}_frame${frames.length}.jpg`,
                            isVideoFrame: true
                        });
                       
                        if (frames.length < frameTimes.length) {
                            video.currentTime = frameTimes[frames.length];
                        } else {
                            currentAttachments.push(...frames);
                            URL.revokeObjectURL(video.src);
                            resolve();
                        }
                    };
                   
                    video.currentTime = frameTimes[0];
                };
               
                video.onerror = () => {
                    console.error('Error loading video');
                    resolve();
                };
            });
        }

        function updateAttachmentsPreview() {
            const container = document.getElementById('attachmentsPreview');
           
            if (currentAttachments.length === 0) {
                container.classList.add('hidden');
                return;
            }
           
            container.classList.remove('hidden');
            container.innerHTML = currentAttachments.map((att, index) => {
                const sizeMB = att.originalSize ? (att.originalSize / 1024 / 1024).toFixed(1) + 'MB' : '';
                return `
                <div class="attachment-item">
                    <img src="data:${att.mimeType};base64,${att.data}" alt="${att.name}">
                    ${sizeMB ? `<div class="attachment-info">${sizeMB}</div>` : ''}
                    <button class="attachment-remove" onclick="removeAttachment(${index})">×</button>
                </div>
            `}).join('');
        }

        function removeAttachment(index) {
            currentAttachments.splice(index, 1);
            updateAttachmentsPreview();
        }

        function renderChatHistory() {
            const historyEl = document.getElementById('chatHistory');
            historyEl.innerHTML = chats.slice().reverse().map(chat => `
                <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="loadChat('${chat.id}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    ${chat.title || 'New Chat'}
                </div>
            `).join('');
        }

        function loadChat(id) {
            currentChatId = id;
            currentAttachments = [];
            updateAttachmentsPreview();
            renderChatHistory();
           
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
           
            chat.messages.forEach(msg => displayMessage(msg));
        }

        function displayMessage(msg) {
            const container = document.getElementById('chatContainer');
            const welcome = container.querySelector('.welcome-screen');
            if (welcome) welcome.remove();

            const isUser = msg.role === 'user';
            const images = msg.images || [];
           
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <div class="message-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}">
                    ${isUser ? 'U' : 'K'}
                </div>
                <div class="message-content">
                    ${images.length ? `
                        <div class="message-images">
                            ${images.map(img => `
                                <img src="data:${img.mimeType};base64,${img.data}"
                                     class="message-image"
                                     alt="${img.name}"
                                     onclick="openLightbox('${img.data}', '${img.mimeType}')">
                            `).join('')}
                        </div>
                    ` : ''}
                    <div>${formatText(msg.content)}</div>
                </div>
            `;
           
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function openLightbox(base64, mimeType) {
            const lightbox = document.createElement('div');
            lightbox.className = 'image-lightbox';
            lightbox.innerHTML = `<img src="data:${mimeType};base64,${base64}" alt="Full size">`;
            lightbox.onclick = () => lightbox.remove();
            document.body.appendChild(lightbox);
        }

        function formatText(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function saveChats() {
            localStorage.setItem('kimi_chats', JSON.stringify(chats));
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const apiKeyInput = document.getElementById('apiKey').value;
            const apiKey = apiKeyInput.trim().replace(/\s/g, '');
            const model = document.getElementById('modelSelect').value;
            const text = input.value.trim();

            console.log('API Key cleaned length:', apiKey.length);
            console.log('API Key starts with sk-:', apiKey.startsWith('sk-'));
            console.log('Using endpoint: https://api.moonshot.ai/v1/chat/completions');
            console.log('Using model:', model);

            if ((!text && currentAttachments.length === 0) || isGenerating) return;
            if (!apiKey) {
                alert('Please enter your API key');
                return;
            }

            if (!apiKey.startsWith('sk-')) {
                alert('Invalid API key format. Moonshot API keys must start with "sk-"');
                return;
            }

            if (document.getElementById('saveKey')?.checked) {
                localStorage.setItem('kimi_api_key', apiKey);
                localStorage.setItem('kimi_model', model);
            }

            if (!currentChatId) {
                currentChatId = generateId();
                chats.push({
                    id: currentChatId,
                    title: text.slice(0, 30) || 'Image Chat',
                    messages: [],
                    createdAt: new Date().toISOString()
                });
            }

            const chat = chats.find(c => c.id === currentChatId);
           
            const messageContent = text;
            const messageImages = [...currentAttachments];
           
            const userMsg = {
                role: 'user',
                content: messageContent,
                images: messageImages
            };
            chat.messages.push(userMsg);
            displayMessage(userMsg);
           
            input.value = '';
            input.style.height = 'auto';
            currentAttachments = [];
            updateAttachmentsPreview();
            renderChatHistory();

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;
           
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message';
            thinkingDiv.innerHTML = `
                <div class="message-avatar ai-avatar">K</div>
                <div class="message-content">
                    <div class="thinking">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                </div>
            `;
            document.getElementById('chatContainer').appendChild(thinkingDiv);

            try {
                const apiMessages = chat.messages.map(m => {
                    if (m.images && m.images.length > 0) {
                        const content = [{ type: 'text', text: m.content || 'Analyze these images:' }];
                        m.images.forEach(img => {
                            content.push({
                                type: 'image_url',
                                image_url: { url: `data:${img.mimeType};base64,${img.data}` }
                            });
                        });
                        return { role: m.role, content };
                    }
                    return { role: m.role, content: m.content };
                });

                console.log('Sending request...');

                const response = await fetch('https://api.moonshot.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: apiMessages,
                        temperature: 1.0,
                        max_tokens: 4096
                    })
                });

                thinkingDiv.remove();

                console.log('Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    let errorMessage;
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMessage = errorData.error?.message || `HTTP ${response.status}`;
                    } catch(e) {
                        errorMessage = `HTTP ${response.status}: ${errorText}`;
                    }
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                const aiMsg = {
                    role: 'assistant',
                    content: data.choices[0].message.content
                };
                chat.messages.push(aiMsg);
                displayMessage(aiMsg);
                saveChats();

            } catch (error) {
                console.error('Full error:', error);
                thinkingDiv.remove();
                displayMessage({ role: 'assistant', content: `Error: ${error.message}` });
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        renderChatHistory();
    </script>
</body>
</html>
