<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi Chat - Multi-Provider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --bg-hover: #252525;
            --accent: #10a37f;
            --accent-hover: #0d8c6d;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --border: #2a2a2a;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-item {
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-item:hover, .chat-item.active {
            background: var(--bg-tertiary);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            max-height: 50vh;
            overflow-y: auto;
        }

        .settings-group {
            margin-bottom: 16px;
        }

        .settings-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .provider-select, .model-select, .api-key-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            font-family: inherit;
        }

        .api-key-input {
            font-family: monospace;
            font-size: 11px;
        }

        .provider-info {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
        }

        .provider-info a {
            color: var(--accent);
            text-decoration: none;
        }

        .compression-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-secondary);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .welcome-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #00d4aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 24px;
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-avatar { background: var(--accent); color: white; }
        .ai-avatar { background: var(--bg-tertiary); border: 1px solid var(--border); }

        .message-content {
            flex: 1;
            padding-top: 6px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }

        .message-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 1px solid var(--border);
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .input-container {
            padding: 20px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .attachments-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .attachment-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
        }

        .attachment-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .attachment-item.video {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
        }

        .attachment-item.video svg {
            width: 32px;
            height: 32px;
            color: var(--accent);
        }

        .attachment-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .message-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 200px;
            font-family: inherit;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .input-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .url-fetch-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .url-fetch-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--info);
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .thinking {
            display: flex;
            gap: 4px;
            align-items: center;
            color: var(--text-secondary);
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        pre {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        pre code { background: none; padding: 0; }

        .hidden { display: none !important; }

        .image-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            cursor: zoom-out;
        }

        .image-lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .fetched-content {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            font-size: 13px;
        }

        .fetched-content h4 {
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .token-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .continue-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-left: auto;
        }

        .provider-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .save-key-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .video-processing {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            text-align: center;
        }

        .free-badge {
            display: inline-block;
            background: var(--success);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Chat
            </button>
        </div>
        <div class="chat-history" id="chatHistory"></div>
        <div class="sidebar-footer">
            <div class="settings-group">
                <label class="settings-label">API Provider</label>
                <select class="provider-select" id="providerSelect" onchange="updateProvider()">
                    <option value="cloudflare">Cloudflare Proxy (Your Worker)</option>
                    <option value="nvidia">NVIDIA NIM (Free) <span class="free-badge">FREE</span></option>
                    <option value="openrouter">OpenRouter (Free Tier)</option>
                    <option value="routway">Routway.ai (Free)</option>
                    <option value="direct">Moonshot Direct (Paid)</option>
                </select>
                <div class="provider-info" id="providerInfo">
                    Uses your Cloudflare Worker. No API key needed in browser.
                </div>
            </div>

            <div class="settings-group">
                <label class="settings-label">API Key</label>
                <input type="password" class="api-key-input" id="apiKey" placeholder="Enter API key (if required)">
                <label class="save-key-toggle">
                    <input type="checkbox" id="saveKey" checked>
                    <span>Save key locally</span>
                </label>
            </div>

            <div class="settings-group">
                <label class="settings-label">Model</label>
                <select class="model-select" id="modelSelect">
                    <option value="kimi-k2.5">kimi-k2.5</option>
                    <option value="moonshotai/kimi-k2.5">moonshotai/kimi-k2.5 (NVIDIA)</option>
                    <option value="moonshotai/kimi-k2-instruct">kimi-k2-instruct (NVIDIA)</option>
                </select>
            </div>

            <div class="settings-group">
                <label class="settings-label">Response Mode</label>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="modeThinking" onclick="setMode('thinking')">Thinking</button>
                    <button class="mode-btn" id="modeInstant" onclick="setMode('instant')">Instant</button>
                </div>
            </div>

            <div class="settings-group">
                <label class="settings-label">Token Limit</label>
                <label class="compression-toggle">
                    <input type="checkbox" id="highTokens" checked>
                    <span>High limit (16k tokens)</span>
                </label>
            </div>
           
            <div class="settings-group">
                <label class="settings-label">Compression</label>
                <label class="compression-toggle">
                    <input type="checkbox" id="enableCompression" checked>
                    <span>Enable image compression</span>
                </label>
                <label class="compression-toggle">
                    <input type="checkbox" id="enableResize" checked>
                    <span>Resize large images</span>
                </label>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <div style="font-weight: 500; display: flex; align-items: center;">
                Kimi Chat
                <span class="provider-badge" id="providerBadge">Cloudflare</span>
            </div>
            <button class="icon-btn" onclick="startNewChat()" title="Clear chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen">
                <h1 class="welcome-title">How can I help you today?</h1>
                <p style="color: var(--text-secondary); margin-top: 8px;">
                    Chat with images • Video analysis • URL fetching<br>
                    <small>Multi-provider support with free tier options</small>
                </p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <div class="attachments-preview hidden" id="attachmentsPreview"></div>
                <div id="fetchedContent" class="fetched-content hidden">
                    <h4>📄 Fetched Content</h4>
                    <div id="fetchedText" style="max-height: 100px; overflow-y: auto; color: var(--text-secondary);"></div>
                </div>
                <textarea class="message-input" id="messageInput" placeholder="Message Kimi... (paste URL to fetch)" rows="1"></textarea>
                <div class="input-footer">
                    <div class="input-actions">
                        <input type="file" id="fileInput" class="hidden" accept="image/*,video/*" multiple onchange="handleFileSelect(event)">
                        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload image/video">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </button>
                        <button class="url-fetch-btn" onclick="fetchUrlFromInput()" title="Fetch URL content">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                            Fetch URL
                        </button>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Provider Configuration
        const PROVIDERS = {
            cloudflare: {
                name: 'Cloudflare',
                endpoint: 'https://kimi-proxy.adam-k-smith13.workers.dev',
                requiresKey: false,
                defaultModel: 'kimi-k2.5',
                info: 'Uses your Cloudflare Worker. No API key needed in browser.'
            },
            nvidia: {
                name: 'NVIDIA NIM',
                endpoint: 'https://integrate.api.nvidia.com/v1/chat/completions',
                requiresKey: true,
                defaultModel: 'moonshotai/kimi-k2.5',
                info: 'Get free API key at build.nvidia.com → Kimi K2.5 → View Code. No credit card required.'
            },
            openrouter: {
                name: 'OpenRouter',
                endpoint: 'https://openrouter.ai/api/v1/chat/completions',
                requiresKey: true,
                defaultModel: 'moonshotai/kimi-k2.5',
                info: 'Get key at openrouter.ai. Free tier available with rate limits.'
            },
            routway: {
                name: 'Routway.ai',
                endpoint: 'https://routway.ai/api/v1/chat/completions',
                requiresKey: true,
                defaultModel: 'kimi-k2-0905',
                info: 'Completely free at routway.ai. Create API key in dashboard.'
            },
            direct: {
                name: 'Moonshot Direct',
                endpoint: 'https://api.moonshot.cn/v1/chat/completions',
                requiresKey: true,
                defaultModel: 'kimi-k2.5',
                info: 'Official API. Requires paid account at platform.moonshot.ai'
            }
        };

        let currentProvider = 'cloudflare';
        let currentMode = 'thinking';
        let fetchedUrlContent = null;
        let currentChatId = null;
        let isGenerating = false;
        let currentAttachments = [];
        let chats = JSON.parse(localStorage.getItem('kimi_chats') || '[]');
        let partialResponse = null;

        // Load saved settings
        const savedProvider = localStorage.getItem('kimi_provider');
        const savedKey = localStorage.getItem('kimi_api_key');
        const savedModel = localStorage.getItem('kimi_model');
        
        if (savedProvider) {
            currentProvider = savedProvider;
            document.getElementById('providerSelect').value = savedProvider;
        }
        if (savedKey) document.getElementById('apiKey').value = savedKey;
        if (savedModel) document.getElementById('modelSelect').value = savedModel;
        
        updateProvider();

        function updateProvider() {
            currentProvider = document.getElementById('providerSelect').value;
            const provider = PROVIDERS[currentProvider];
            
            // Update UI
            document.getElementById('providerBadge').textContent = provider.name;
            document.getElementById('providerInfo').textContent = provider.info;
            
            // Show/hide API key input
            const keyInput = document.getElementById('apiKey');
            if (provider.requiresKey) {
                keyInput.style.display = 'block';
                keyInput.placeholder = `Enter ${provider.name} API key`;
            } else {
                keyInput.style.display = 'none';
            }
            
            // Update model options
            const modelSelect = document.getElementById('modelSelect');
            if (currentProvider === 'nvidia') {
                modelSelect.innerHTML = `
                    <option value="moonshotai/kimi-k2.5">moonshotai/kimi-k2.5</option>
                    <option value="moonshotai/kimi-k2-instruct">moonshotai/kimi-k2-instruct</option>
                `;
            } else if (currentProvider === 'routway') {
                modelSelect.innerHTML = `
                    <option value="kimi-k2-0905">kimi-k2-0905</option>
                `;
            } else {
                modelSelect.innerHTML = `
                    <option value="kimi-k2.5">kimi-k2.5</option>
                    <option value="kimi-k1.5">kimi-k1.5</option>
                `;
            }
            
            localStorage.setItem('kimi_provider', currentProvider);
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeThinking').classList.toggle('active', mode === 'thinking');
            document.getElementById('modeInstant').classList.toggle('active', mode === 'instant');
        }

        // Auto-resize textarea
        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // URL Fetching
        async function fetchUrlFromInput() {
            const text = document.getElementById('messageInput').value;
            const urlMatch = text.match(/(https?:\/\/[^\s]+)/);
            
            if (!urlMatch) {
                alert('No URL found in message. Paste a URL first.');
                return;
            }

            const url = urlMatch[0];
            const btn = document.querySelector('.url-fetch-btn');
            btn.style.opacity = '0.5';
            btn.innerHTML = 'Fetching...';

            try {
                // Use allorigins as CORS proxy
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Failed to fetch');
                
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Clean up
                doc.querySelectorAll('script, style, nav, footer, header, iframe').forEach(el => el.remove());
                
                const mainContent = doc.querySelector('main, article, [role="main"]') || doc.body;
                let textContent = mainContent.innerText || mainContent.textContent;
                textContent = textContent.replace(/\s+/g, ' ').trim();
                
                // Limit length
                const maxLength = 8000;
                if (textContent.length > maxLength) {
                    textContent = textContent.substring(0, maxLength) + '... [truncated]';
                }

                fetchedUrlContent = {
                    url: url,
                    title: doc.title || url,
                    content: textContent
                };

                const fetchedDiv = document.getElementById('fetchedContent');
                const fetchedText = document.getElementById('fetchedText');
                fetchedDiv.classList.remove('hidden');
                fetchedText.textContent = `${fetchedUrlContent.title}\n\n${textContent.substring(0, 200)}...`;
                
                btn.innerHTML = 'Fetched ✓';
                btn.style.color = 'var(--accent)';
                
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Failed to fetch URL. Try again or check the URL.');
                btn.innerHTML = 'Fetch URL';
            } finally {
                btn.style.opacity = '1';
            }
        }

        // Image/Video handling
        async function compressImage(file) {
            const enableCompression = document.getElementById('enableCompression').checked;
            const enableResize = document.getElementById('enableResize').checked;
           
            if (!enableCompression && !enableResize) {
                return await fileToBase64(file);
            }

            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
               
                img.onload = () => {
                    URL.revokeObjectURL(url);
                   
                    let { width, height } = img;
                    const maxSize = 2048;
                   
                    if (enableResize && (width > maxSize || height > maxSize)) {
                        if (width > height) {
                            height = Math.round((height * maxSize) / width);
                            width = maxSize;
                        } else {
                            width = Math.round((width * maxSize) / height);
                            height = maxSize;
                        }
                    }
                   
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                   
                    let quality = 0.9;
                    if (enableCompression) {
                        if (file.size > 5 * 1024 * 1024) quality = 0.7;
                        else if (file.size > 2 * 1024 * 1024) quality = 0.8;
                    }
                   
                    const mimeType = file.type === 'image/png' && enableCompression ? 'image/jpeg' : file.type;
                    const compressed = canvas.toDataURL(mimeType, quality);
                    resolve(compressed);
                };
               
                img.src = url;
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handleFileSelect(event) {
            const files = Array.from(event.target.files);
           
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    const base64 = await compressImage(file);
                    currentAttachments.push({
                        type: 'image',
                        mimeType: file.type,
                        data: base64.split(',')[1],
                        name: file.name,
                        originalSize: file.size,
                        displayType: 'image'
                    });
                } else if (file.type.startsWith('video/')) {
                    const videoId = generateId();
                    currentAttachments.push({
                        type: 'video',
                        id: videoId,
                        file: file,
                        name: file.name,
                        originalSize: file.size,
                        displayType: 'video',
                        frames: [],
                        processing: true
                    });
                    processVideoFrames(file, videoId);
                }
            }
           
            updateAttachmentsPreview();
            event.target.value = '';
        }

        async function processVideoFrames(file, videoId) {
            const attachment = currentAttachments.find(a => a.id === videoId);
            if (!attachment) return;

            try {
                const frames = await extractVideoFrames(file);
                attachment.frames = frames;
                attachment.processing = false;
                updateAttachmentsPreview();
            } catch (error) {
                console.error('Video processing error:', error);
                attachment.processing = false;
                attachment.error = true;
                updateAttachmentsPreview();
            }
        }

        async function extractVideoFrames(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const frames = [];
               
                video.src = URL.createObjectURL(file);
                video.muted = true;
                video.playsInline = true;
               
                video.onloadedmetadata = () => {
                    const duration = video.duration;
                    const frameTimes = [
                        0, 
                        duration * 0.25, 
                        duration * 0.5, 
                        duration * 0.75, 
                        Math.min(duration * 0.95, duration - 0.1)
                    ].filter(t => t >= 0 && t <= duration);
                    
                    let currentFrame = 0;
                   
                    video.onseeked = async () => {
                        let { videoWidth, videoHeight } = video;
                        const maxSize = 1024;
                       
                        if (videoWidth > maxSize || videoHeight > maxSize) {
                            if (videoWidth > videoHeight) {
                                videoHeight = Math.round((videoHeight * maxSize) / videoWidth);
                                videoWidth = maxSize;
                            } else {
                                videoWidth = Math.round((videoWidth * maxSize) / videoHeight);
                                videoHeight = maxSize;
                            }
                        }
                       
                        canvas.width = videoWidth;
                        canvas.height = videoHeight;
                        ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                       
                        const base64 = canvas.toDataURL('image/jpeg', 0.85);
                        frames.push({
                            type: 'image',
                            mimeType: 'image/jpeg',
                            data: base64.split(',')[1],
                            name: `${file.name}_frame${frames.length}.jpg`
                        });
                       
                        if (frames.length < frameTimes.length) {
                            video.currentTime = frameTimes[frames.length];
                        } else {
                            URL.revokeObjectURL(video.src);
                            resolve(frames);
                        }
                    };
                   
                    video.currentTime = frameTimes[0];
                };
               
                video.onerror = () => {
                    URL.revokeObjectURL(video.src);
                    resolve(frames);
                };
            });
        }

        function updateAttachmentsPreview() {
            const container = document.getElementById('attachmentsPreview');
           
            if (currentAttachments.length === 0) {
                container.classList.add('hidden');
                return;
            }
           
            container.classList.remove('hidden');
            container.innerHTML = currentAttachments.map((att, index) => {
                if (att.displayType === 'video') {
                    return `
                        <div class="attachment-item video" style="position: relative;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            <div style="font-size: 10px; color: var(--text-secondary); text-align: center; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;">
                                ${att.name}
                            </div>
                            ${att.processing ? 
                                '<div class="video-processing">Processing...</div>' : 
                                att.error ? 
                                '<div class="video-processing" style="color: var(--error);">Error</div>' :
                                `<div class="video-processing" style="color: var(--accent);">${att.frames.length} frames</div>`
                            }
                            <button class="attachment-remove" onclick="removeAttachment(${index})">×</button>
                        </div>
                    `;
                } else {
                    return `
                        <div class="attachment-item">
                            <img src="data:${att.mimeType};base64,${att.data}" alt="${att.name}">
                            <button class="attachment-remove" onclick="removeAttachment(${index})">×</button>
                        </div>
                    `;
                }
            }).join('');
        }

        function removeAttachment(index) {
            const att = currentAttachments[index];
            if (att.type === 'video' && att.file) {
                URL.revokeObjectURL(att.file);
            }
            currentAttachments.splice(index, 1);
            updateAttachmentsPreview();
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function startNewChat() {
            currentChatId = null;
            currentAttachments = [];
            fetchedUrlContent = null;
            partialResponse = null;
            updateAttachmentsPreview();
            document.getElementById('fetchedContent').classList.add('hidden');
            document.getElementById('messageInput').value = '';
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome-screen">
                    <h1 class="welcome-title">How can I help you today?</h1>
                    <p style="color: var(--text-secondary); margin-top: 8px;">
                        Chat with images • Video analysis • URL fetching<br>
                        <small>Multi-provider support with free tier options</small>
                    </p>
                </div>
            `;
            renderChatHistory();
        }

        function renderChatHistory() {
            const historyEl = document.getElementById('chatHistory');
            historyEl.innerHTML = chats.slice().reverse().map(chat => `
                <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="loadChat('${chat.id}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    ${chat.title || 'New Chat'}
                </div>
            `).join('');
        }

        function loadChat(id) {
            currentChatId = id;
            currentAttachments = [];
            fetchedUrlContent = null;
            partialResponse = null;
            updateAttachmentsPreview();
            document.getElementById('fetchedContent').classList.add('hidden');
            renderChatHistory();
           
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
           
            chat.messages.forEach(msg => displayMessage(msg));
        }

        function displayMessage(msg, isPartial = false) {
            const container = document.getElementById('chatContainer');
            const welcome = container.querySelector('.welcome-screen');
            if (welcome) welcome.remove();

            const isUser = msg.role === 'user';
            const images = msg.images || [];
           
            const div = document.createElement('div');
            div.className = 'message';
            div.id = isPartial ? 'partial-message' : '';
            div.innerHTML = `
                <div class="message-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}">
                    ${isUser ? 'U' : 'K'}
                </div>
                <div class="message-content">
                    ${images.length ? `
                        <div class="message-images">
                            ${images.map(img => `
                                <img src="data:${img.mimeType};base64,${img.data}"
                                     class="message-image"
                                     alt="${img.name}"
                                     onclick="openLightbox('${img.data}', '${img.mimeType}')">
                            `).join('')}
                        </div>
                    ` : ''}
                    <div>${formatText(msg.content)}</div>
                    ${isPartial ? `
                        <div class="token-warning">
                            <span>⚠️ Response truncated</span>
                            <button class="continue-btn" onclick="continueResponse()">Continue</button>
                        </div>
                    ` : ''}
                </div>
            `;
           
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function openLightbox(base64, mimeType) {
            const lightbox = document.createElement('div');
            lightbox.className = 'image-lightbox';
            lightbox.innerHTML = `<img src="data:${mimeType};base64,${base64}" alt="Full size">`;
            lightbox.onclick = () => lightbox.remove();
            document.body.appendChild(lightbox);
        }

        function formatText(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function saveChats() {
            localStorage.setItem('kimi_chats', JSON.stringify(chats));
        }

        async function continueResponse() {
            const partialMsg = document.getElementById('partial-message');
            if (partialMsg) {
                const warning = partialMsg.querySelector('.token-warning');
                if (warning) warning.remove();
            }
            await sendMessage(true);
        }

        async function sendMessage(isContinuation = false) {
            const input = document.getElementById('messageInput');
            const model = document.getElementById('modelSelect').value;
            const apiKey = document.getElementById('apiKey').value;
            const text = isContinuation ? 'Continue from where you left off.' : input.value.trim();

            // Check processing videos
            const processingVideos = currentAttachments.filter(att => att.type === 'video' && att.processing);
            if (processingVideos.length > 0) {
                alert('Please wait for video processing to complete...');
                return;
            }

            if ((!text && currentAttachments.length === 0 && !fetchedUrlContent) || isGenerating) return;

            // Save settings
            localStorage.setItem('kimi_model', model);
            if (document.getElementById('saveKey').checked && apiKey) {
                localStorage.setItem('kimi_api_key', apiKey);
            }

            if (!currentChatId) {
                currentChatId = generateId();
                chats.push({
                    id: currentChatId,
                    title: text.slice(0, 30) || 'Web Content',
                    messages: [],
                    createdAt: new Date().toISOString()
                });
            }

            const chat = chats.find(c => c.id === currentChatId);
           
            // Build message content
            let messageContent = text;
            if (fetchedUrlContent && !isContinuation) {
                messageContent += `\n\n[Content from ${fetchedUrlContent.url}]:\n${fetchedUrlContent.content}`;
            }

            // Prepare images
            const allImages = [];
            currentAttachments.forEach(att => {
                if (att.type === 'image') {
                    allImages.push({
                        type: 'image',
                        mimeType: att.mimeType,
                        data: att.data,
                        name: att.name
                    });
                } else if (att.type === 'video' && att.frames.length > 0) {
                    att.frames.forEach(frame => {
                        allImages.push({
                            type: 'image',
                            mimeType: frame.mimeType,
                            data: frame.data,
                            name: frame.name
                        });
                    });
                }
            });

            const userMsg = {
                role: 'user',
                content: messageContent,
                images: allImages
            };
            
            if (!isContinuation) {
                chat.messages.push(userMsg);
                displayMessage(userMsg);
            }
           
            if (!isContinuation) {
                input.value = '';
                input.style.height = 'auto';
                currentAttachments = [];
                fetchedUrlContent = null;
                document.getElementById('fetchedContent').classList.add('hidden');
                updateAttachmentsPreview();
                renderChatHistory();
            }

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;
           
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message';
            thinkingDiv.id = 'thinking-message';
            thinkingDiv.innerHTML = `
                <div class="message-avatar ai-avatar">K</div>
                <div class="message-content">
                    <div class="thinking">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                </div>
            `;
            document.getElementById('chatContainer').appendChild(thinkingDiv);

            try {
                const apiMessages = chat.messages.map(m => {
                    if (m.images && m.images.length > 0) {
                        const content = [{ type: 'text', text: m.content }];
                        m.images.forEach(img => {
                            content.push({
                                type: 'image_url',
                                image_url: { url: `data:${img.mimeType};base64,${img.data}` }
                            });
                        });
                        return { role: m.role, content };
                    }
                    return { role: m.role, content: m.content };
                });

                const provider = PROVIDERS[currentProvider];
                const highTokens = document.getElementById('highTokens').checked;
                
                // Build request body
                const requestBody = {
                    model: model,
                    messages: apiMessages,
                    max_tokens: highTokens ? 16384 : 4096,
                    temperature: currentMode === 'thinking' ? 1.0 : 0.6,
                    top_p: 0.95
                };

                // Add thinking mode control for compatible providers
                if (currentMode === 'instant' && currentProvider !== 'cloudflare') {
                    requestBody.extra_body = { thinking: { type: 'disabled' } };
                }

                // Build headers
                const headers = {
                    'Content-Type': 'application/json'
                };
                
                if (provider.requiresKey && apiKey) {
                    headers['Authorization'] = `Bearer ${apiKey}`;
                }
                
                // OpenRouter specific headers
                if (currentProvider === 'openrouter') {
                    headers['HTTP-Referer'] = window.location.href;
                    headers['X-Title'] = 'Kimi Chat';
                }

                console.log('Sending to:', provider.endpoint, 'Max tokens:', requestBody.max_tokens);

                const response = await fetch(provider.endpoint, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });

                thinkingDiv.remove();

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                const aiContent = data.choices[0].message.content;
                const finishReason = data.choices[0].finish_reason;
                
                console.log('Finish reason:', finishReason, 'Length:', aiContent.length);

                const aiMsg = {
                    role: 'assistant',
                    content: aiContent
                };

                // Check for truncation
                const wasTruncated = finishReason === 'length' || 
                                    (aiContent.length > 100 && aiContent.slice(-3).includes('...'));

                chat.messages.push(aiMsg);
                
                if (wasTruncated) {
                    displayMessage(aiMsg, true);
                    partialResponse = aiContent;
                } else {
                    displayMessage(aiMsg);
                    partialResponse = null;
                }
                
                saveChats();

            } catch (error) {
                console.error('Full error:', error);
                thinkingDiv.remove();
                displayMessage({ role: 'assistant', content: `Error: ${error.message}` });
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        renderChatHistory();
    </script>
